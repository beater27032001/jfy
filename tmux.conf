# tmux só do jfy (socket -L jfy): não mexe no seu tmux normal
set -g mouse on
set -g default-terminal "tmux-256color"
set -g escape-time 10
set -g history-limit 50000
set -g base-index 0
set -g allow-rename off
set -g automatic-rename off
set -g status-position bottom
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bold,fg=colour39] jfy "
set -g status-left-length 10
set -g status-right "#(jfy --relogio)#[fg=colour244]Ctrl-b: 0 menu · c comandos  #[fg=colour255,bold]%H:%M "
set -g status-right-length 200
set -g window-status-format " #I #W "
set -g window-status-current-format "#[reverse,bold] #I #W "
# aba fica vermelha quando o Claude toca o sino (pede atenção)
set -g monitor-bell on
set -g bell-action other
set -g window-status-bell-style "bg=colour203,fg=colour232,bold"

# aba do menu sempre destacada
set -g window-status-format "#{?#{==:#I,0},#[fg=colour39#,bold],} #I #W "

# barra da direita (jfy --relogio): reunião em até 1h, uso da IA, cronômetro da jornada; depois o relógio
# o jfy --relogio fica rodando e manda uma linha por segundo (o andador do tema anda); o tmux mostra a última
set -g status-interval 15
# Ctrl-b p pausa/retoma a jornada (troca o "aba anterior" padrão); Ctrl-b r zera, com confirmação
bind p run-shell "jfy --pausar" \; refresh-client -S
bind r confirm-before -p "Zerar o cronômetro da jornada? (y/n)" "run-shell 'jfy --zerar' ; refresh-client -S"
# Ctrl-b m entra na chamada da reunião que está rolando ou da próxima (troca o "marcar painel" padrão)
bind m run-shell -b "jfy --entrar"
# Ctrl-b c mostra todos os comandos (troca o "nova janela" padrão: as abas do jfy nascem pelo menu)
bind c display-popup -E -w 74 -h 90% -T " jfy: comandos " "jfy --atalhos"
# cliques na barra (ranges do jfy --relogio): ✉ abre o leitor de emails num popup, 📅 entra na chamada;
# o resto da barra (as abas) segue o padrão do tmux
bind -n MouseDown1Status {
  if -F "#{==:#{mouse_status_range},email}" {
    display-popup -E -w 90% -h 85% -T " jfy: emails " "jfy --email"
  } {
    if -F "#{==:#{mouse_status_range},reuniao}" { run-shell -b "jfy --entrar" } { switch-client -t = }
  }
}
